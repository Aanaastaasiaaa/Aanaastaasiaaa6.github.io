<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор стоимости заказа</title>
</head>
<body>
<h1>Калькулятор стоимости заказа</h1>

<div>
    <label for="quantity">Количество товара:</label><br>
    <input type="text" id="quantity" placeholder="Введите количество">
    <div id="quantity-error" style="color: red; display: none;"></div>
</div>

<div style="margin-top: 15px;">
    <label for="product">Выберите товар:</label><br>
    <select id="product">
        <option value="12990">Телевизор - 12 990 руб.</option>
        <option value="5490">Плойка для волос - 5 490 руб.</option>
        <option value="1990">Тостер - 1 990 руб.</option>
        <option value="25990">Телефон - 25 990 руб.</option>
        <option value="8990">Пылесос - 8 990 руб.</option>
    </select>
</div>

<button id="calculate-btn" style="margin-top: 15px; padding: 10px 20px;">Рассчитать стоимость</button>

<div id="result" style="margin-top: 20px; padding: 15px; background: #f0f0f0; display: none;">
    <h3>Стоимость заказа:</h3>
    <div id="total-cost" style="font-size: 24px; font-weight: bold; color: green;">0 руб.</div>
</div>

<script src="calculator.js" defer></script>
</body>
</html>
